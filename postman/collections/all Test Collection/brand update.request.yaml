$kind: http-request
url: "{{sahilbaseurlNeelamv2}}brand/updateById/1"
method: PUT
body:
  type: json
  content: "{\r

    \  \"brandname\": \"{{brandname}}\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{sahilNeelamV2Token}}"
scripts:
  - type: beforeRequest
    code: pm.environment.set("brandname", "hpUpd" + Date.now());
    language: text/javascript
settings: {}
order: 4000

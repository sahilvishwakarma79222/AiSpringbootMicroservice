$kind: http-request
url: "{{baseUrl}}/topic/module/1/page?pageNumber=0&pageSize=10&field=title&direction=asc"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
queryParams:
  - key: pageNumber
    value: "0"
  - key: pageSize
    value: "10"
  - key: field
    value: title
  - key: direction
    value: asc
  - key: search
    value: java
    disabled: true
body:
  type: text
  content: |-
    {
        "name": "Introduction to Programming",
        "description": "This module covers basics of programming",
        "createdAt": "2026-06-10T10:30:00"
        // ,
        // "staffId": 1001,
        // "topicIds": [101, 102, 103]
    }
auth:
  type: bearer
  credentials:
    token: "{{helper token}}"
settings: {}
order: 6000

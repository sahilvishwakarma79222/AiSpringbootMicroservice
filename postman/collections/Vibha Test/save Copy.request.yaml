$kind: http-request
url: 192.168.1.128:8080/api/v2/warehouse/save
method: POST
body:
  type: json
  content: "{\r

    \    \"warehousename\":\"{{warehousename}}\",\r

    \    \"location\":\"{{location}}\",\r

    \    \"type\":\"{{type}}\",\r

    \    \r

    \    \"branch\":{\r

    \        \"id\":1\r

    \    }\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{vibhatoken}}"
scripts:
  - type: beforeRequest
    code: "let ts = Date.now().toString().slice(-6);\r

      \r

      pm.environment.set(\"warehousename\", \"Warehouse\" + ts);\r

      pm.environment.set(\"location\", \"Ambernath\" + ts);\r

      pm.environment.set(\"type\",\"Secondary\" + ts);\r

      \r\n"
    language: text/javascript
settings: {}
order: 1000

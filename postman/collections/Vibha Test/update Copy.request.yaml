    \    \"warehousename\":\"{{warehousename}}\",\r

    \    \"location\":\"{{location}}\",\r

    \    \"type\":\"{{type}}\",\r

    \    \r

    \    \"branch\":{\r

    \        \"id\":2\r

    \    }\r

    }"
